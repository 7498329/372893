<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>兰州牛肉面 · 一碗面的十二种活法</title>
<meta name="description" content="一清二白三红四绿五黄。翻开十二块面馆木牌，把牛肉、萝卜、蒜苗和鲜面一样样放进碗里，再顺着一条面条走完这碗面的两百年。">
<meta name="format-detection" content="telephone=no,email=no,address=no">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta property="og:description" content="一清二白三红四绿五黄。一根面，十二种脾气，二百年烟火。">

<style>
/* ============ 设计令牌 ============ */
:root{
  --paper:#efe3c8;
  --paper-hi:#faf3e1;
  --ink:#2b241c;
  --ink2:#4d4133;
  --ink3:#8a7861;
  --teal:#5d827e;
  --teal-l:#94b3ae;
  --chili:#b83b2b;
  --chili-l:#d4634a;
  --wood:#c9853f;
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","STZhongsong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.32,.72,.30,1);
  --spring:cubic-bezier(.34,1.42,.64,1);
  --crop:0px;   /* 铺满时左右被裁掉的纸边，fitStages() 写入 */
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:var(--sans);color:var(--ink);
  background:#e4d7bc url("assets/paper.webp") center/cover no-repeat;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
}
#bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 42%,rgba(253,248,234,.55) 0%,rgba(251,244,226,.26) 46%,rgba(206,184,146,.38) 100%);
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* ============ 开场遮罩（等封面解码，避免白闪与素材弹入） ============ */
#veil{
  position:fixed;inset:0;z-index:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:#efe3c8 url("assets/paper.webp") center/cover no-repeat;
  transition:opacity .62s ease,visibility .62s;
  /* 兜底：万一脚本没跑起来，遮罩 3.4s 后自己消失，绝不把人挡在门外 */
  animation:veilAuto 0s linear 3.4s forwards;
}
@keyframes veilAuto{to{opacity:0;visibility:hidden;pointer-events:none}}
#veil::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 46%,rgba(253,248,234,.72) 0%,rgba(233,220,192,.30) 62%,rgba(206,184,146,.34) 100%);
}
#veil.gone{opacity:0;visibility:hidden;pointer-events:none}
.vSeal{
  position:relative;z-index:1;
  width:58px;height:58px;display:grid;place-items:center;
  font-family:var(--serif);font-size:29px;font-weight:700;color:var(--chili);
  border:1.6px solid rgba(184,59,43,.62);border-radius:3px;
  background:rgba(184,59,43,.05);
  margin-bottom:20px;
}
.vName{
  position:relative;z-index:1;
  font-family:var(--serif);font-size:31px;letter-spacing:.34em;text-indent:.34em;
  color:var(--ink);line-height:1;
}
.vTip{
  position:relative;z-index:1;
  margin-top:16px;font-size:15px;letter-spacing:.40em;text-indent:.40em;
  color:var(--ink3);font-weight:300;
}
.vLine{
  position:relative;z-index:1;display:block;
  width:132px;height:2px;margin-top:26px;border-radius:2px;overflow:hidden;
  background:rgba(96,74,46,.16);
}
.vLine b{
  position:absolute;left:0;top:0;height:100%;width:38%;border-radius:2px;
  background:linear-gradient(90deg,rgba(184,59,43,0),rgba(184,59,43,.72),rgba(184,59,43,0));
  animation:veilRun 1.25s ease-in-out infinite;
}
@keyframes veilRun{0%{transform:translateX(-105%)}100%{transform:translateX(305%)}}

/* ============ 舞台 ============ */
.stage{
  position:absolute;left:50%;top:50%;transform-origin:50% 50%;z-index:2;
  opacity:0;transition:opacity .45s ease;
  /* 关键：未启用的舞台必须彻底让开点击，否则上层那块 1334×750 的透明舞台
     会把下层的按钮全挡住（竖屏页点不动就是这个原因） */
  pointer-events:none;
}
.stage.live{opacity:1;pointer-events:auto}
#stageP{width:750px;height:1334px}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  box-shadow:inset 0 0 100px rgba(93,68,38,.13),inset 0 0 0 1px rgba(96,74,46,.14);
}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;overflow:hidden;transition:opacity .3s ease}
.page.slow{transition:opacity .72s var(--ease)}
.page.on{opacity:1;pointer-events:auto}

/* ============ P1 封面 ============ */
#p1{background:#e9dcc0}
#p1 .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 46%}
#p1.on .cover{animation:coverIn .8s var(--ease) both}
@keyframes coverIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}

/* 第二层：只裁出「碗与面」那半幅，接缝落在副标题下方的空白纸面，
   入场结束后淡入（与底层像素完全重合，看不出接缝），再过一会儿轻颠三下 */
#p1 .coverJump{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  -webkit-clip-path:inset(27.7% 0 0 0);clip-path:inset(27.7% 0 0 0);
  opacity:0;pointer-events:none;will-change:transform;
}
#p1.on .coverJump{
  animation:jumpFade .2s linear .86s both,
            coverHopY 3.05s cubic-bezier(.4,.05,.32,1) 1.1s both;
}
@keyframes jumpFade{from{opacity:0}to{opacity:1}}
/* 只做纯位移：海报里的黄底按钮与 HTML 按钮必须严丝合缝，
   任何缩放都会让两者错开一两个像素 */
@keyframes coverHopY{
  0%,   5%  {transform:translateY(0)}
  14%       {transform:translateY(-18px)}
  25%       {transform:translateY(0)}
  32%       {transform:translateY(-9px)}
  41%       {transform:translateY(0)}
  48%       {transform:translateY(-4px)}
  57%, 100% {transform:translateY(0)}
}
/* 「开始制作」按钮跟封面同幅跳动，位移量与节奏完全一致 */
@keyframes hopSyncY{
  0%,   5%  {transform:translate(-50%,-50%)}
  14%       {transform:translate(-50%,calc(-50% - 18px))}
  25%       {transform:translate(-50%,-50%)}
  32%       {transform:translate(-50%,calc(-50% - 9px))}
  41%       {transform:translate(-50%,-50%)}
  48%       {transform:translate(-50%,calc(-50% - 4px))}
  57%, 100% {transform:translate(-50%,-50%)}
}
#p1.on .startWrap{animation:hopSyncY 3.05s cubic-bezier(.4,.05,.32,1) 1.1s both}
#p1.on .startWrap.hopDone{animation:none}
#p1 .coverJump.hopDone{animation:none;opacity:1}

.startWrap{position:absolute;left:50.55%;top:88.35%;width:44.6%;transform:translate(-50%,-50%);z-index:20}
.startWrap::before{ /* 呼吸光晕 */
  content:"";position:absolute;inset:-16px -12px;border-radius:60px;
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,203,60,.55),rgba(255,203,60,0) 72%);
  filter:blur(2px);opacity:.5;
  animation:halo 3.4s ease-in-out 1.4s infinite;
}
@keyframes halo{0%,100%{opacity:.28;transform:scale(.97)}50%{opacity:.72;transform:scale(1.03)}}
.startBtn{
  position:relative;display:block;width:100%;
  transition:transform .26s var(--spring),filter .26s ease;
  filter:drop-shadow(0 6px 12px rgba(120,72,20,.22));
}
.startBtn img{display:block;width:100%;height:auto}
.startBtn span{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:39px;letter-spacing:.15em;
  text-indent:.15em;color:#241a10;
}
.startBtn:active{transform:scale(.95);filter:drop-shadow(0 2px 6px rgba(120,72,20,.26))}

.arrowHint{
  position:absolute;left:50%;top:94.1%;transform:translateX(-50%);
  z-index:19;opacity:0;animation:hintIn .9s var(--ease) 1s forwards;
}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.arrowHint svg{display:block;width:40px;height:40px;stroke:#3a2d1e;stroke-width:2.5;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.66;
  animation:bob 2.1s ease-in-out 1.9s infinite}
.arrowHint svg path:last-child{opacity:.36}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

/* 铺满（cover）会把画面左右各裁掉 --crop：版式页是纸边，无所谓；
   但 P1/P8 是整幅海报，裁下去标题就缺字了 —— 这两页整块按可视宽度回缩，
   上下露一点纸底，海报一字不缺 */
#p1, #p8{ transform: scale(var(--safe,1)); transform-origin:50% 50%; }

/* ============ 通用小件 ============ */
.seal{
  display:grid;place-items:center;border:2px solid var(--chili);border-radius:3px;
  color:var(--chili);font-family:var(--serif);font-weight:700;
  writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.04em;
  opacity:.82;line-height:1.05;
}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(96,74,46,.30),transparent)}

/* 翻页按钮：竖版统一放底部正中 */
.nextBtn{
  position:absolute;left:50%;bottom:66px;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:9px;
  padding:14px 24px 14px 28px;border-radius:40px;
  font-size:21px;letter-spacing:.16em;color:var(--ink2);
  background:rgba(253,247,233,.66);
  border:1px solid rgba(96,74,46,.26);
  backdrop-filter:blur(3px);
  box-shadow:0 3px 14px rgba(96,68,36,.10);
  transition:transform .26s var(--spring),background .26s ease,box-shadow .26s ease;
}
.nextBtn svg{width:20px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nextBtn:active{transform:translateX(-50%) scale(.94);background:rgba(253,247,233,.92)}
.nextBtn.is-idle{opacity:.34}

/* 页面指示 */
.dots{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:9px;z-index:40;pointer-events:none}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(96,74,46,.26);transition:all .45s var(--ease)}
.dot.on{width:17px;border-radius:3px;background:var(--chili)}

/* ============ P2/P3 面型翻牌（竖版：顶部标题 / 中部 3×2 木牌 / 底部提示与翻页） ============ */
.lpHead{position:absolute;left:0;right:0;top:0;height:236px}
.lpHead .sign{
  position:absolute;left:50%;top:76px;transform:translateX(-50%);
  display:block;width:400px;height:auto;
  filter:drop-shadow(0 5px 10px rgba(120,72,20,.20));
}
.tagL,.tagR{
  position:absolute;top:40px;
  font-family:var(--serif);font-size:17px;letter-spacing:.3em;color:var(--ink3);
  white-space:nowrap;
}
.tagL{left:calc(var(--crop) + 16px)}
.tagR{right:calc(var(--crop) + 16px);letter-spacing:.16em}
.tagR b{color:var(--chili);font-weight:600;font-size:21px;padding:0 2px}

/* 横版两侧的竖排小字，竖版收成「木牌下方一行居中提示」 */
.sideCol{display:none}
.sideCol.r{
  display:flex;position:absolute;left:0;right:0;bottom:196px;justify-content:center;
}
.sideCol.r .v{
  writing-mode:horizontal-tb;text-orientation:mixed;
  font-family:var(--serif);font-size:18px;letter-spacing:.32em;text-indent:.32em;
  color:rgba(96,74,46,.42);white-space:nowrap;
}

.grid{
  position:absolute;left:50%;top:664px;transform:translate(-50%,-50%);
  display:grid;grid-template-columns:repeat(3,var(--cw));grid-auto-rows:var(--ch);
  gap:24px 26px;perspective:1500px;
}
#p2,#p3{--cw:180px;--ch:289px}

.card{
  position:relative;width:var(--cw);height:var(--ch);
  background:none;transition:opacity .4s ease,filter .4s ease;z-index:1;
}
.card .lift{
  position:absolute;inset:0;transition:transform .46s var(--spring);
  transform-origin:50% 50%;
}
.card .inner{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .92s cubic-bezier(.30,.78,.32,1);
  will-change:transform;
}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .face img{display:block;width:100%;height:100%;object-fit:contain}
.card .face.back{transform:rotateY(180deg)}
.card.focus{z-index:9}
/* 竖屏上木牌只有 206 宽，翻开时把这张「拿起来」放大到 1.28，背面小字才读得清 */
.card.focus .lift{transform:scale(1.12);filter:drop-shadow(0 16px 26px rgba(96,62,24,.26))}
.grid.hasFocus .card:not(.focus){opacity:.86}

.vtxt{
  position:absolute;left:23%;right:9%;top:11%;bottom:9%;
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:17px;line-height:1.5;color:#3f2a16;
  font-family:var(--serif);letter-spacing:0;
  padding-top:2px;
  overflow:hidden;
}
.vtxt b{font-weight:600;color:#7c3a1c}
.seal2{
  position:absolute;left:7%;bottom:8%;width:27px;height:27px;
  font-size:11px;letter-spacing:0;border-width:1.5px;border-radius:2px;
  background:rgba(184,59,43,.05);
}

/* ============ P4 拖拽成面（竖版：上标题 / 中碗 / 下食材一排） ============ */
.p4Top{position:absolute;left:0;right:0;top:48px;text-align:center}
.p4Top .t{font-family:var(--serif);font-size:37px;letter-spacing:.26em;text-indent:.26em;color:var(--ink)}
.p4Top .s{margin-top:10px;font-size:17px;letter-spacing:.26em;color:var(--ink3)}

.bowlArea{position:absolute;left:50%;top:560px;transform:translate(-50%,-50%);width:520px;height:432px;
  transition:transform .95s var(--ease)}
/* 食材托盘收起后下半屏会空一块：成品碗放大并下移，落回视觉中心 */
.bowlArea.done{transform:translate(-50%,-50%) translateY(58px) scale(1.1)}
.bowlArea .bowl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 14px 22px rgba(80,52,20,.20))}
.bowlArea .full{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  opacity:0;transform:scale(1.035);transition:opacity 1s var(--ease),transform 1.3s var(--ease);
  filter:drop-shadow(0 16px 26px rgba(80,52,20,.24))}
.bowlArea.done .full{opacity:1;transform:scale(1)}
.bowlArea .rain{position:absolute;left:50%;top:50%;width:1px;height:1px}

.bowlArea .target{
  position:absolute;left:50%;top:50%;width:376px;height:290px;
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px dashed rgba(184,59,43,.20);
  opacity:1;transition:opacity .7s ease;
  animation:breathe 3.4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}
  50%{transform:translate(-50%,-50%) scale(1.035);opacity:.9}}
.bowlArea.done .target{opacity:0;animation:none}

.steam{position:absolute;left:50%;bottom:calc(100% - 96px);transform:translateX(-50%);
  width:420px;height:300px;pointer-events:none;opacity:0;transition:opacity 1s ease}
.bowlArea.done .steam{opacity:1}
.wisp{
  position:absolute;bottom:0;width:64px;height:120px;border-radius:50%;
  background:radial-gradient(50% 46% at 50% 52%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.72) 42%,rgba(255,255,255,0) 76%);
  filter:blur(5px);opacity:0;
  animation:rise 3.8s ease-in-out infinite;
}
@keyframes rise{
  0%{opacity:0;transform:translateY(18px) scale(.65,.55)}
  20%{opacity:.95}
  68%{opacity:.5}
  100%{opacity:0;transform:translateY(-132px) scale(1.5,1.75)}
}

.tray{position:absolute;inset:0;z-index:8}
.chip{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  touch-action:none;cursor:grab;z-index:12;
  transition:transform .48s var(--spring),opacity .4s ease;
  will-change:transform;
}
.chip img{display:block;pointer-events:none;filter:drop-shadow(0 7px 12px rgba(88,58,24,.24))}
.chip .cap{
  margin-top:8px;font-size:19px;letter-spacing:.2em;text-indent:.2em;color:var(--ink2);
  font-family:var(--serif);white-space:nowrap;
  padding:3px 12px;border-radius:20px;background:rgba(253,247,233,.55);
  border:1px solid rgba(96,74,46,.16);
}
.chip.dragging{transition:none;cursor:grabbing;z-index:30}
.chip.dragging img{filter:drop-shadow(0 18px 22px rgba(88,58,24,.34))}
.chip.placed .cap{opacity:0;transform:translateY(6px)}
.chip.placed{z-index:6;pointer-events:none}
.chip.placed img{position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(86,50,16,.62)) drop-shadow(0 0 2.5px rgba(86,50,16,.42))}
.chip.placed::after{
  content:'';position:absolute;left:50%;top:52%;width:86%;height:36%;
  transform:translate(-50%,0);border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%,rgba(84,46,12,.27) 0%,rgba(84,46,12,.13) 46%,rgba(84,46,12,0) 76%);
}
.chip.gone{opacity:0!important;pointer-events:none!important}
.chip.ghost{opacity:0;transform:scale(.6);pointer-events:none}

.bowlShade{
  position:absolute;left:50%;top:50%;width:362px;height:284px;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(56% 54% at 50% 58%,rgba(104,72,38,.17) 0%,rgba(104,72,38,.085) 44%,rgba(104,72,38,0) 74%);
  opacity:1;transition:opacity .6s ease;
}
.bowlArea.done .bowlShade{opacity:0}

.ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  border:2px solid rgba(255,255,255,.9);
  animation:ripple .75s var(--ease) forwards;
}
@keyframes ripple{
  from{opacity:.9;transform:translate(-50%,-50%) scale(.2)}
  to{opacity:0;transform:translate(-50%,-50%) scale(1.7)}
}

/* 提示条：竖版放标题下方居中，不压碗 */
.toast{
  position:absolute;left:50%;top:186px;z-index:45;
  padding:16px 26px;border-radius:4px;
  background:rgba(253,247,233,.92);
  border:1px solid rgba(96,74,46,.24);
  box-shadow:0 10px 26px rgba(88,58,24,.18);
  font-family:var(--serif);font-size:27px;letter-spacing:.13em;color:#3f2a16;
  white-space:nowrap;
  opacity:0;transform:translate(-50%,10px) scale(.96);
  transition:opacity .6s var(--ease),transform .6s var(--spring);
  pointer-events:none;
}
.toast::after{display:none}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ============ P5 时间轴（竖版：一根面从上往下走，三屏竖向滚动） ============ */
#p5{overflow:hidden}
/* 面条从屏幕顶端穿上来，标题下面垫一层纸色渐隐，字才看得清 */
#p5::before{
  content:'';position:absolute;left:0;right:0;top:0;height:228px;z-index:26;pointer-events:none;
  background:linear-gradient(180deg,rgba(243,234,212,.97) 0%,rgba(243,234,212,.93) 54%,rgba(243,234,212,0) 100%);
}

const HIST = [

   d:'东乡族马六七把"小车牛肉老汤面"的技艺带进兰州。他在国子监结识同窗陈维精，得授秘方，带回中原的熬汤老方与手工揉面的底子。这门手艺跨过黄河落户兰州，就此埋下百年风味的伏笔。',
   pos:'above'},

   d:'制作技艺入选国家级非遗名录。认定的是"拉制"这个动作——手工揉面、抻拉、出条。机器能压出标准粗细，却复刻不了师傅感知面团筋度与温度的那点活态智慧。',

   d:'全产业链产值突破千亿元，门店总量达 8.2 万家。11 月 1 日，《兰州牛肉拉面产业促进条例》正式施行，从"政策推动"转向"法治引领"，守住风味底线，也为出海立起刚性框架。',
   pos:'above'}
];

const ITEMS = [
  {id:'beef',   name:'牛肉片', img:'assets/beef.webp',         w:136, slot:[-70,-40], sc:.70, rot:-9},
  {id:'radish', name:'白萝卜', img:'assets/radish.webp',        w:146, slot:[ 72,-56], sc:.70, rot:7},
  {id:'sprout', name:'青蒜苗', img:'assets/sprout.webp',        w:116, slot:[ 88, 46], sc:.62, rot:-5},
  {id:'noodle', name:'鲜面条', img:'assets/noodle_bundle.webp', w:160, slot:[-82, 52], sc:.58, rot:-4}
];

/* =====================================================================
   基础工具
   ===================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const stageP = $('#stageP');
const SW = 750, SH = 1334;                       // 唯一画布：竖版 750×1334
/* 碗口椭圆（逻辑坐标）：碗区 560 宽居中，中心 y=566 */
const BOWL = {x:375, y:560, rx:237, ry:197};

const view = { k:1, crop:0 };

/* 只有一块竖版舞台。
   手机（短边 ≤ 600）一律「铺满」：按 cover 放大，左右各裁掉一点纸边
   （裁切量最多 82，版式全部排在 600 安全宽内，一个字都不会被切）；
   平板/桌面屏幕够大，等比缩放整块放下，不裁切。 */
function fitStages(){
  const vw = innerWidth, vh = innerHeight;
  const kMin = Math.min(vw/SW, vh/SH);
  const kMax = Math.max(vw/SW, vh/SH);
  /* 只有"手机形态"才铺满：短边 ≤600 且长宽比 ≥1.7（≈375×667 起）。
     分屏窗口、折叠屏展开、小平板这类接近正方的视口仍走 contain，
     否则 cover 会把上下（而不是左右）裁掉，标题和按钮会被切。 */
  const phone = Math.min(vw, vh) <= 600 && vh / vw >= 1.70;

  let k = phone ? kMax : kMin;
  let crop = 0;
  if(phone){
    crop = Math.max(0, (SW*k - vw) / (2*k));
    if(crop > 82){ crop = 82; k = vw / (SW - 2*crop); }
  }
  view.k = k; view.crop = crop;
  stageP.style.transform = `translate(-50%,-50%) scale(${k})`;
  document.documentElement.style.setProperty('--crop', crop.toFixed(1) + 'px');
  document.documentElement.style.setProperty('--safe', (1 - 2*crop/SW).toFixed(4));
  document.body.dataset.fit = `k=${k.toFixed(3)} crop=${crop.toFixed(1)} vw=${vw} vh=${vh}`;
}

/* 逻辑坐标（750×1334）↔ 视口坐标 */
function toClient(x, y){
  const k = view.k;
  return { x: innerWidth/2 + (x - SW/2)*k, y: innerHeight/2 + (y - SH/2)*k };
}
function toStageXY(cx, cy){
  const k = view.k;
  return { x: SW/2 + (cx - innerWidth/2)/k, y: SH/2 + (cy - innerHeight/2)/k };
}
function toStage(e){ return toStageXY(e.clientX, e.clientY); }

/* 视口位移 → 逻辑位移 */
function toStageVec(dx, dy){
  return { x: dx/view.k, y: dy/view.k };
}

/* =====================================================================
   页面流转
   ===================================================================== */
const state = { page:0, tlIdx:0, activeNode:null, busy:false };

function go(n){
  if(state.busy || n === state.page) return;
  state.busy = true;

  const cur = $('.page.on');
  if(cur){ cur.classList.remove('slow'); cur.classList.remove('on'); }

  setTimeout(()=>{
    const nx = $('#p'+n);

    if(n===5){ state.tlIdx = 0; syncTimeline(true); }
    if(n===2 || n===3) refreshFocus(n);
    // 重回封面时清掉上次动画的收尾标记，让「颠三下」能再演一次
    if(n===1) $$('#p1 .hopDone').forEach(el=>el.classList.remove('hopDone'));

    nx.classList.add('slow');
    // 强制回流，保证过渡生效
    void nx.offsetWidth;
    nx.classList.add('on');
    state.page = n;
    paintDots();
    setTimeout(()=>{ state.busy = false; }, 680);
  }, 250);
}

function paintDots(){
  let cur = state.page;
  if(cur === 5) cur = 5 + state.tlIdx;
  $$('[data-dots]').forEach(box=>{
    if(!box.children.length){
      for(let i=0;i<8;i++){
        const d = document.createElement('i');
        d.className = 'dot';
        box.appendChild(d);
      }
    }
    [...box.children].forEach((d,i)=>d.classList.toggle('on', i+1 === cur));
  });
}

/* 视口变化：手机地址栏收放、横竖屏切换、桌面拖窗口都走这里 */
let fitTimer;
function refit(){
  clearTimeout(fitTimer);
  fitTimer = setTimeout(()=>{
    fitStages();
    // 舞台缩放变了，时间轴的像素位移要跟着归一化，否则翻页会错位
    if(state.page === 5) setTrackY(-state.tlIdx * 1334, true);
  }, 90);
}
addEventListener('resize', refit);
addEventListener('orientationchange', refit);
if(window.visualViewport) visualViewport.addEventListener('resize', refit);

/* =====================================================================
   P1 / P8
   ===================================================================== */
$('#startBtn').addEventListener('click', ()=>{
  go(2);
});

/* 以前这里会尝试 requestFullscreen + orientation.lock 锁横屏。
   那个做法在 Android 上能成，但一进全屏就一直全屏：回到竖屏的收尾页（P8）
   会被挤在一个横屏视口里缩成小条，退出全屏的入口还不好找。
   现在改成「把横版舞台转 90° 铺满」——手机竖着拿时画面是横的，
   用户把手机横过来就是一张正立的满屏横版；系统自动旋转开着的话也自然对上。 */
$('#resetBtn').addEventListener('click', ()=>{
  resetAll();
  state.page = 0;
  go(1);
});

function resetAll(){
  // 翻牌复位
  $$('.card').forEach(c=>{
    c.classList.remove('turn','focus','turned');
    c.querySelector('.inner').style.transform = 'rotateY(0deg)';
    c.dataset.deg = 0;
  });
  flipCount = {2:0, 3:0};
  $('#c2').textContent = '0'; $('#c3').textContent = '0';
  // 食材复位
  placedSet.clear();                      // 关键：不清空会导致二次游玩时第一次落料就误判「已满碗」
  $$('.chip').forEach(ch=>{
    ch.classList.remove('placed','ghost','gone','dragging');
    ch.dataset.placed = '';
    ch.style.transition = 'none';
    ch.style.opacity = '';                // 清掉成品动画留下的 inline opacity
    ch.style.pointerEvents = '';
    ch.style.zIndex = '';
    ch.style.transformOrigin = '';
    ch.style.transform = '';
    ch.style.left = ch.dataset.ox + 'px';
    ch.style.top  = ch.dataset.oy + 'px';
    void ch.offsetWidth;
    ch.style.transition = '';
  });
  $$('.ripple').forEach(r=>r.remove());
  $('#bowlArea').classList.remove('done');
  $('#toast').classList.remove('show');
  // 时间轴
  state.tlIdx = 0; state.activeNode = null;
  $$('.tlNode').forEach(n=>n.classList.remove('act','hot'));
  $$('.tlPanel').forEach(p=>p.classList.remove('show'));
  const sg = $('.tlSvg'); if(sg) sg.classList.remove('dyeing');
  syncTimeline(true);
}

/* =====================================================================
   P2 / P3  面型翻牌
   ===================================================================== */
let flipCount = {2:0, 3:0};

function buildGrid(pid, list, offset){
  const g = $('#grid'+pid);
  g.innerHTML = '';
  list.forEach((nd, i)=>{
    const idx = offset + i;
    const card = document.createElement('button');
    card.className = 'card';
    card.dataset.deg = 0;
    card.dataset.pid = pid;
    card.dataset.idx = idx;
    card.setAttribute('aria-label', nd.n + '，寓意' + nd.r + '，轻触翻看');
    card.innerHTML = `
      <div class="lift">
        <div class="inner">
          <div class="face front"><img src="assets/plaque_${nd.n}.webp" alt=""></div>
          <div class="face back">
            <img src="assets/plaque_blank.webp" alt="">
            <div class="vtxt"><b>${nd.a}</b>${nd.b}</div>
            <i class="seal seal2">${nd.r}</i>
          </div>
        </div>
      </div>`;
    g.appendChild(card);
  });
}

function onCardTap(card){
  const pid = card.dataset.pid;
  const inner = card.querySelector('.inner');
  const cur = Number(card.dataset.deg) || 0;
  const deg = cur + 180;                 // 每次点击继续同向旋转，累计 360°
  card.dataset.deg = deg;
  inner.style.transform = `rotateY(${deg}deg)`;

  const nowTurned = (deg % 360) !== 0;
  card.classList.toggle('turned', nowTurned);

  // 计数
  const turnedCount = $$('.card', $('#grid'+pid)).filter(c=>c.classList.contains('turned')).length;
  if(turnedCount !== flipCount[pid]){
    flipCount[pid] = turnedCount;
    $('#c'+pid).textContent = turnedCount;
  }

  // 焦点：放大当前翻开的这张
  $$('.card').forEach(c=>c.classList.remove('focus'));
  if(nowTurned){
    card.classList.add('focus');
    $('#grid'+pid).classList.add('hasFocus');
    // 翻牌结束后的 0.2s 轻微回弹
    setTimeout(()=>{
      card.animate(
        [{transform:'scale(1)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],
        {duration:230, easing:'cubic-bezier(.3,.9,.4,1)'}
      );
    }, 900);
  }else{
    setTimeout(()=>{
      card.animate(
        [{transform:'scale(1)'},{transform:'scale(1.025)'},{transform:'scale(1)'}],
        {duration:220, easing:'cubic-bezier(.3,.9,.4,1)'}
      );
    }, 900);
  }
  refreshFocus(pid);
}

function refreshFocus(pid){
  const g = $('#grid'+pid);
  if(!g) return;
  g.classList.toggle('hasFocus', !!g.querySelector('.card.focus'));
}

document.addEventListener('click', (e)=>{
  const card = e.target.closest('.card');
  if(card){ onCardTap(card); return; }
  const next = e.target.closest('[data-next]');
  if(next){ go(Number(next.dataset.next)); }
});

/* =====================================================================
   P4  拖拽成面
   ===================================================================== */
const tray = $('#tray');
const bowlArea = $('#bowlArea');
const placedSet = new Set();

/* 各素材的高宽比（用于把一排料的下沿对齐） */
const RATIO = {beef:429/440, radish:361/440, sprout:509/440, noodle:413/560};

function buildTray(){
  tray.innerHTML = '';
  /* 竖版：四样料一排摆在碗下方（left/top 是左上角，按各自图片宽度居中到 cx） */
  /* 竖版：四样料一排，图片底边对齐在 BASE，标签自然排成一条线 */
  const BASE = 1000;
  const pos = ITEMS.map((it, i)=>{
    const xs = [80, 226, 384, 512];
    const hh = Math.round(it.w * (RATIO[it.id] || .9));
    return { x: xs[i], y: BASE - hh };
  });
  ITEMS.forEach((it, i)=>{
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.id = it.id;
    el.dataset.ox = pos[i].x;
    el.dataset.oy = pos[i].y;
    el.style.left = pos[i].x + 'px';
    el.style.top  = pos[i].y + 'px';
    el.innerHTML = `<img src="${it.img}" style="width:${it.w}px" alt=""><span class="cap">${it.name}</span>`;
    tray.appendChild(el);
    attachDrag(el, it);
  });
}

function attachDrag(el, it){
  let sx=0, sy=0, ox=0, oy=0, pid=null, dragging=false, moved=false;

  const onMove = (e)=>{
    if(!dragging || (pid !== null && e.pointerId !== pid)) return;
    if(e.cancelable) e.preventDefault();
    const p = toStage(e);
    const dx = p.x - sx, dy = p.y - sy;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    el.style.transform = `translate(${dx}px,${dy}px) rotate(${it.rot * 0.4}deg) scale(1.04)`;
  };

  const unbind = ()=>{
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  };

  const onUp = (e)=>{
    if(!dragging) return;
    if(pid !== null && e.pointerId !== pid) return;
    dragging = false; pid = null;
    unbind();
    el.classList.remove('dragging');
    el.style.zIndex = '';

    const p = toStage(e);
    const dx = p.x - sx, dy = p.y - sy;

    // 逻辑坐标计算中心（不受 transform 过渡影响）
    const w = el.offsetWidth, h = el.offsetHeight;
    const cx = ox + dx + w / 2;
    const cy = oy + dy + h / 2;

    // 是否落在碗口范围内（含 10px 容差）
    const ex = (cx - BOWL.x) / (BOWL.rx + 10);
    const ey = (cy - BOWL.y) / (BOWL.ry + 10);
    if(moved && ex*ex + ey*ey <= 1){
      place(el, it);
    }else{
      // 没进碗：老老实实滑回原位，不留下任何偏移
      el.style.transition = 'transform .42s cubic-bezier(.3,1.25,.55,1)';
      el.style.transform = '';
      setTimeout(()=>{
        if(!el.classList.contains('placed') && !el.classList.contains('dragging')){
          el.style.transition = '';
          el.style.transformOrigin = '';
        }
      }, 470);
    }
  };

  el.addEventListener('pointerdown', (e)=>{
    if(el.classList.contains('placed') || el.classList.contains('gone')) return;
    if(e.button !== undefined && e.button > 0) return;
    e.preventDefault();

    // 把当前位置「焊」到 left/top 上，再清掉残留 transform：
    // 反复拖拽时位移不会逐次累积，素材不会越拖越偏、最后跑出画面
    const lx = parseFloat(el.style.left), ly = parseFloat(el.style.top);
    ox = Number.isFinite(lx) ? lx : el.offsetLeft;
    oy = Number.isFinite(ly) ? ly : el.offsetTop;
    el.style.transition = 'none';
    el.style.left = ox + 'px';
    el.style.top  = oy + 'px';
    el.style.transformOrigin = '';
    el.style.transform = '';
    void el.offsetWidth;

    const p = toStage(e);
    sx = p.x; sy = p.y;
    dragging = true; moved = false; pid = e.pointerId;
    el.classList.add('dragging');
    el.style.zIndex = 40;

    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    // 兜底：指针捕获在部分环境会失败，窗口级监听保证一定能收尾
    window.addEventListener('pointermove', onMove, {passive:false});
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

function dist(x,y){ return Math.hypot(x-BOWL.x, y-BOWL.y); }

function place(el, it){
  const img = el.querySelector('img');
  // 用自然宽高比推尺寸：图片尚未解码也不会算出 0 高，落位永远准确
  const nw = img.naturalWidth || it.w;
  const nh = img.naturalHeight || Math.round(it.w * 0.8);
  const w = it.w;
  const h = Math.round(w * nh / nw);
  const targetLeft = BOWL.x + it.slot[0] - w/2;
  const targetTop  = BOWL.y + it.slot[1] - h/2;

  el.classList.remove('dragging');
  el.classList.add('placed');
  el.dataset.placed = '1';

  // 复位到槽位（用 left/top 直接定位，避免与 translate 混用）
  el.style.transition = 'left .5s cubic-bezier(.3,1.3,.55,1), top .5s cubic-bezier(.3,1.3,.55,1), transform .5s cubic-bezier(.3,1.3,.55,1), opacity .35s ease';
  el.style.transform = '';
  requestAnimationFrame(()=>{
    el.style.left = targetLeft + 'px';
    el.style.top  = targetTop  + 'px';
    el.style.transformOrigin = '50% 50%';
    el.style.transform = `rotate(${it.rot}deg) scale(${it.sc})`;
  });
  setTimeout(()=>{ el.style.transition = ''; }, 560);

  // 落汤涟漪
  const r = document.createElement('i');
  r.className = 'ripple';
  const size = 120;
  r.style.cssText = `left:${BOWL.x+it.slot[0]}px;top:${BOWL.y+it.slot[1]}px;width:${size}px;height:${size}px;z-index:5`;
  tray.appendChild(r);
  setTimeout(()=>r.remove(), 800);

  placedSet.add(it.id);
  if(placedSet.size === ITEMS.length) finishBowl();
}

function finishBowl(){
  setTimeout(()=>{
    bowlArea.classList.add('done');
    // 用 class 隐藏，复位时一键清掉，不会残留看不见的 inline 样式
    $$('.chip.placed').forEach(c=> c.classList.add('gone'));
    setTimeout(()=>{ $('#toast').classList.add('show'); }, 900);
  }, 200);
  placedSet.clear();
}

/* =====================================================================
   P5  时间轴
   ===================================================================== */
const TL = window.TL;
let tlBuilt = false;

function buildTimeline(){
  if(tlBuilt) return;
  tlBuilt = true;
  const track = $('#tlTrack'), page5 = $('#p5');
  track.style.height = TL.canvasH + 'px';

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('class','tlSvg');
  svg.setAttribute('width', TL.canvasW);
  svg.setAttribute('height', TL.canvasH);
  svg.setAttribute('viewBox', `0 0 ${TL.canvasW} ${TL.canvasH}`);

  // 红色浸染高亮（用 mask 只显示某一段，保留面条肌理）
  const defs = document.createElementNS(NS,'defs');
  defs.innerHTML = `
    <filter id="dyeRed" x="-30%" y="-6%" width="160%" height="112%"
            color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0.34 0.66 0.13 0 -0.030
        0.14 0.28 0.06 0 -0.018
        0.10 0.19 0.04 0 -0.014
        0 0 0 1 0"/>
    </filter>
    <mask id="segMask" maskUnits="userSpaceOnUse" x="0" y="0"
          width="${TL.canvasW}" height="${TL.canvasH}">
      <rect x="0" y="0" width="${TL.canvasW}" height="${TL.canvasH}" fill="#000"/>
      <path id="segPath" fill="none" stroke="#fff" stroke-width="124"
            stroke-linecap="round" pathLength="1000"
            stroke-dasharray="0 1200" stroke-dashoffset="0"
            d="${TL.path}"/>
    </mask>`;
  svg.appendChild(defs);

  // 面条本体（横版素材顺时针转 90° 的竖版，沿新曲线重映射）
  const rib = TL.ribbon;
  const img = document.createElementNS(NS,'image');
  img.setAttribute('href','assets/noodle_ribbon_v.webp');
  img.setAttribute('x', rib.x); img.setAttribute('y', rib.y);
  img.setAttribute('width', rib.w); img.setAttribute('height', rib.h);
  svg.appendChild(img);

  // 红色段（同一张面，被红色滤镜染色后按 mask 显影）
  const dye = document.createElementNS(NS,'image');
  dye.setAttribute('class','dye');
  dye.setAttribute('href','assets/noodle_ribbon_v.webp');
  dye.setAttribute('x', rib.x); dye.setAttribute('y', rib.y);
  dye.setAttribute('width', rib.w); dye.setAttribute('height', rib.h);
  dye.setAttribute('mask','url(#segMask)');
  dye.setAttribute('filter','url(#dyeRed)');
  svg.appendChild(dye);
  track.appendChild(svg);

  // 节点：沿面条从上往下排
  TL.nodes.forEach((nd, i)=>{
    const data = HIST[i];
    const btn = document.createElement('button');
    btn.className = 'tlNode hot';
    btn.style.left = nd.cx + 'px';
    btn.style.top  = nd.cy + 'px';
    btn.dataset.i = i;
    btn.setAttribute('aria-label', data.yr + ' ' + data.hd);
    btn.innerHTML = `<span class="ring"></span><span class="num">${i+1}</span>
      <span class="lb">${data.yr}</span>`;
    btn.addEventListener('click', ()=>openNode(i));
    track.appendChild(btn);

    // 故事面板固定在屏幕下半部（挂 #p5，不跟面条一起滚），宽度吃满才读得清
    const p = document.createElement('div');
    p.className = 'tlPanel';
    p.dataset.i = i;
    p.innerHTML = `<button class="x" aria-label="收起故事">×</button>
      <div class="yr">${data.yr}</div><div class="hd">${data.hd}</div>
      <div class="bd">${data.d}</div>`;
    p.querySelector('.x').addEventListener('click', closeNode);
    page5.appendChild(p);
  });

  setTimeout(()=>{ if(state.page===5 && state.activeNode===null) openNode(0, true); }, 700);
}

function closeNode(){
  if(state.activeNode === null) return;
  state.activeNode = null;
  $$('.tlNode').forEach(n=>{ n.classList.remove('act'); n.classList.add('hot'); });
  $$('.tlPanel').forEach(p=>p.classList.remove('show'));
  const svg = $('.tlSvg'); if(svg) svg.classList.remove('dyeing');
  updateTlNext();
}

function openNode(i, silent){
  const nodes = $$('.tlNode');
  const panels = $$('.tlPanel');
  const svg = $('.tlSvg');
  if(state.activeNode === i && !silent){
    state.activeNode = null;
    nodes[i].classList.remove('act');
    nodes.forEach(n=>n.classList.add('hot'));
    panels[i].classList.remove('show');
    svg.classList.remove('dyeing');
    return;
  }
  state.activeNode = i;
  nodes.forEach((n,k)=>{
    n.classList.toggle('act', k===i);
    n.classList.toggle('hot', k!==i);
  });
  panels.forEach((p,k)=>p.classList.toggle('show', k===i));
  updateTlNext();

  // 高亮「该节点所在面段」= 上一节点与下一节点的中点之间
  const us = TL.nodes.map(n=>n.u);
  const start = i === 0 ? 4 : (us[i-1] + us[i]) / 2;
  const end   = i === us.length-1 ? 1000 : (us[i] + us[i+1]) / 2;
  const len = Math.max(26, end - start);
  const sp = $('#segPath');
  sp.setAttribute('stroke-dasharray', `${len} 1200`);
  sp.setAttribute('stroke-dashoffset', `${-start}`);
  svg.classList.add('dyeing');

  // 把节点滚到面板上方的安全区（y≈400），否则故事弹出来会把它盖住
  const need = TL.nodes[i].cy;
  const target = Math.max(-(TL.canvasH - 1334), Math.min(0, 400 - need));
  if(Math.abs(target - currentY) > 40){
    setTrackY(target, true);
    state.tlIdx = Math.max(0, Math.min(2, Math.round(-target / 1334)));
    paintDots();
    updateTlNext();
  }
}

/* 竖向拖拽 */
let currentY = 0, dragging = false, startY = 0, startTrack = 0,
    lastY = 0, vy = 0, lastT = 0;
const viewport = $('#tlViewport'), track = $('#tlTrack');

function setTrackY(y, animate){
  const min = -(TL.canvasH - 1334);
  currentY = Math.max(min, Math.min(0, y));
  track.classList.toggle('anim', !!animate);
  track.style.transform = `translateY(${currentY}px)`;
  if(animate) setTimeout(()=>track.classList.remove('anim'), 580);
}

function updateTlNext(){
  const btn = $('#tlNext');
  const atEnd = state.tlIdx >= 2;
  // 故事卡占着下半屏时先不露收尾按钮，点 × 收起后再出现
  btn.style.display = (atEnd && state.activeNode === null) ? 'flex' : 'none';
  $('#tlHint').style.opacity = (atEnd || state.activeNode !== null) ? '0' : '.85';
}

function syncTimeline(instant){
  state.tlIdx = 0;
  setTrackY(0, !instant);
  updateTlNext();
}

viewport.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('.tlNode') || e.target.closest('.tlPanel')) return;
  dragging = true; startY = e.clientY; startTrack = currentY;
  lastY = e.clientY; vy = 0; lastT = performance.now();
  track.classList.remove('anim');
  viewport.classList.add('drag');
  try{ viewport.setPointerCapture(e.pointerId); }catch(_){}
});
viewport.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  if(e.cancelable) e.preventDefault();
  const d = toStageVec(0, e.clientY - startY);
  setTrackY(startTrack + d.y, false);
  const now = performance.now();
  const dt = Math.max(1, now - lastT);
  const step = toStageVec(0, e.clientY - lastY);
  vy = step.y / dt;                      // 逻辑像素/毫秒
  lastY = e.clientY; lastT = now;
}, {passive:false});
const endDrag = ()=>{
  if(!dragging) return;
  dragging = false;
  viewport.classList.remove('drag');
  const projected = currentY + vy * 240;
  let idx = Math.round(-projected / 1334);
  idx = Math.max(0, Math.min(2, idx));
  setTrackY(-idx * 1334, true);
  state.tlIdx = idx;
  paintDots();
  updateTlNext();
};
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);

/* 桌面端滚轮 / 触控板：竖向翻时间轴（一次一格，带节流） */
let wheelLock = 0, wheelAcc = 0;
viewport.addEventListener('wheel', (e)=>{
  if(state.page !== 5) return;
  e.preventDefault();
  const now = performance.now();
  const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if(now < wheelLock){ wheelAcc = 0; return; }
  wheelAcc += d;
  if(Math.abs(wheelAcc) < 16) return;
  const dir = wheelAcc > 0 ? 1 : -1;
  wheelAcc = 0;
  const idx = Math.max(0, Math.min(2, state.tlIdx + dir));
  if(idx === state.tlIdx){
    if(dir === 1) go(8);              // 已在末屏继续下滚 → 收尾
    return;
  }
  state.tlIdx = idx;
  setTrackY(-idx * 1334, true);
  paintDots();
  updateTlNext();
  wheelLock = now + 460;
}, {passive:false});

$('#tlNext').addEventListener('click', ()=>go(8));

/* =====================================================================
   键盘（方便桌面预览）
   ===================================================================== */
addEventListener('keydown', (e)=>{
  const fwd  = e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown';
  const back = e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp';
  if(fwd){
    if(state.page === 5){
      if(state.tlIdx < 2){
        state.tlIdx++; setTrackY(-state.tlIdx*1334, true); paintDots(); updateTlNext();
      }else go(8);
    }else if(state.page && state.page < 8){ go(state.page + 1); }
  }
  if(back){
    if(state.page === 5 && state.tlIdx > 0){
      state.tlIdx--; setTrackY(-state.tlIdx*1334, true); paintDots(); updateTlNext();
    }else if(state.page > 1){ go(state.page - 1); }
  }
});

/* =====================================================================
   自检（?t=1 时在标题栏输出各交互结果，便于自动化核验）
   ===================================================================== */
function runTest(){
  const R = [];
  const ok = (k, v)=>R.push(k + '=' + (v ? 'OK' : 'FAIL'));
  const sleep = ms=> new Promise(r=>setTimeout(r, ms));

  (async ()=>{
    // 1) 翻牌
    const c0 = $$('#grid2 .card')[0];
    c0.click();
    ok('flip1', c0.classList.contains('turned') && c0.querySelector('.inner').style.transform.includes('180'));
    c0.click();
    ok('flip360', !c0.classList.contains('turned') &&
       c0.querySelector('.inner').style.transform.includes('360'));
    ok('gridIsolated', $$('#grid3 .card.turned').length === 0 && $('#c3').textContent === '0');

    // 2) 拖拽吸附（合成指针事件，坐标走 toClient，横竖屏/旋转下都成立）
    const chip = $('.chip[data-id="beef"]');
    const from = toClient(148, 932);          // 竖版：牛肉片所在位置
    const to   = toClient(BOWL.x, BOWL.y);
    const ev = (type, p)=> new PointerEvent(type, {clientX:p.x, clientY:p.y, bubbles:true, pointerId:1, isPrimary:true});
    chip.dispatchEvent(ev('pointerdown', from));
    chip.dispatchEvent(ev('pointermove', {x:(from.x+to.x)/2, y:(from.y+to.y)/2}));
    chip.dispatchEvent(ev('pointermove', to));
    chip.dispatchEvent(ev('pointerup', to));
    ok('snap', chip.classList.contains('placed'));
    // 拖到碗外应当回位
    const c2 = $('.chip[data-id="radish"]');
    const out1 = toClient(120, 300);          // 碗外的左上角
    c2.dispatchEvent(ev('pointerdown', from));
    c2.dispatchEvent(ev('pointermove', out1));
    c2.dispatchEvent(ev('pointerup', out1));
    ok('noSnapOutside', !c2.classList.contains('placed'));
    // 拖到碗外后必须原地归位，left/top 不被写坏
    ok('noDrift', Math.abs(parseFloat(c2.style.left) - Number(c2.dataset.ox)) < 0.6 &&
       Math.abs(parseFloat(c2.style.top) - Number(c2.dataset.oy)) < 0.6);
    // 同一块料连拖两次，位置不累积漂移
    const out2 = toClient(620, 420);          // 碗外的右侧
    c2.dispatchEvent(ev('pointerdown', from));
    c2.dispatchEvent(ev('pointermove', out2));
    c2.dispatchEvent(ev('pointerup', out2));
    await sleep(240);
    ok('repeatDrag', Math.abs(parseFloat(c2.style.left) - Number(c2.dataset.ox)) < 0.6 &&
       Math.abs(parseFloat(c2.style.top) - Number(c2.dataset.oy)) < 0.6 &&
       !c2.classList.contains('placed'));
    if(!chip.classList.contains('placed')){
      const rc = chip.getBoundingClientRect();
      const d = toStageXY(rc.left + rc.width/2, rc.top + rc.height/2);
      R.push('dbg:' + Math.round(d.x) + ',' + Math.round(d.y) + ',' +
             Math.round(view.k*1000)/1000 + ',' + Math.round(rc.width));
    }

    // 3) 全部入碗 -> 成品
    ITEMS.forEach(it=>{
      const el = $('.chip[data-id="'+it.id+'"]');
      if(!el.classList.contains('placed')) place(el, it);
    });
    await sleep(420);
    ok('bowlDone', bowlArea.classList.contains('done'));
    await sleep(950);
    ok('toast', $('#toast').classList.contains('show'));

    // 4) 时间轴节点
    openNode(2);
    ok('nodeSeg', $('#segPath').getAttribute('stroke-dasharray') !== '0 1200');
    ok('dyeOn', $('.tlSvg').classList.contains('dyeing'));
    openNode(4);
    ok('switch', $$('.tlPanel.show').length === 1);

    // 5) 复位
    resetAll();
    ok('reset', $$('.card.turned').length === 0 && $$('.chip.placed').length === 0 &&
       $$('.chip.gone').length === 0 && placedSet.size === 0 &&
       !$('.tlSvg').classList.contains('dyeing') && state.activeNode === null);
    // 封面「面碗颠三下」：动画确实被挂上（播放中或已播完并摘掉都算通过）
    const cj = $('.coverJump'), swm = $('.startWrap');
    const hasKF = (name)=>{
      for(const ss of document.styleSheets){
        let rules; try{ rules = ss.cssRules; }catch(_){ continue; }
        for(const r of rules){ if(r.type === CSSRule.KEYFRAMES_RULE && r.name === name) return true; }
      }
      return false;
    };
    const anC = getComputedStyle(cj).animationName || '';
    ok('coverHop', hasKF('coverHopY') &&
       (cj.classList.contains('hopDone') || anC.indexOf('coverHopY') >= 0 || !$('#p1').classList.contains('on')));
    ok('coverHopSync', hasKF('hopSyncY') &&
       (swm.classList.contains('hopDone') || (getComputedStyle(swm).animationName || '').indexOf('hopSyncY') >= 0
        || !$('#p1').classList.contains('on')));

    // 6) 复位后能重新完整走一遍（二次游玩不再误判满碗）
    const r2 = $('.chip[data-id="radish"]');
    place(r2, ITEMS.find(x=>x.id==='radish'));
    ok('secondRound', bowlArea.classList.contains('done') === false && placedSet.size === 1);

    // 7) 竖版舞台：坐标互逆、舞台整块落在视口内、每个版块都在画布里
    const c00 = toClient(0, 0), back = toStageXY(c00.x, c00.y);
    ok('coordInverse', Math.abs(back.x) < 1 && Math.abs(back.y) < 1);
    const sp = stageP.getBoundingClientRect();
    ok('fitAxis', Math.abs(sp.width - 750*view.k) < 2 && Math.abs(sp.height - 1334*view.k) < 2);
    ok('fitInView', view.crop > 1
       ? (sp.width >= innerWidth - 1 && Math.abs(sp.height - innerHeight) < 2)
       : (sp.width <= innerWidth + 2 && sp.height <= innerHeight + 2));
    // 3×2 木牌网格：不压标题牌、不压底部提示与按钮
    const g2 = $('#grid2');
    ok('gridInCanvas', g2.offsetTop - g2.offsetHeight/2 >= 236 &&
       g2.offsetTop + g2.offsetHeight/2 <= 1120);
    // 碗与食材排都在画布里
    const ba = $('#bowlArea');
    ok('bowlInCanvas', ba.offsetTop >= 240 && ba.offsetTop + ba.offsetHeight <= 1000);
    const chipLast = $('.chip[data-id="noodle"]');
    const bowlBottom = ba.offsetTop + ba.offsetHeight/2;   // offsetTop 是中心，不含 translate
    ok('trayInCanvas', chipLast.offsetTop > bowlBottom &&
       chipLast.offsetLeft + chipLast.offsetWidth <= 750);
    // 时间轴：竖版画布 750 宽 × 三屏高，节点严格从上往下
    const tk = $('#tlTrack');
    ok('tlVertical', TL.canvasW === 750 && TL.canvasH === 4002 &&
       Math.abs(tk.offsetHeight - 4002) < 2 &&
       TL.nodes.every((n,k)=> k === 0 || n.cy > TL.nodes[k-1].cy));
    // 故事面板：居中、整块在屏幕内、且不遮住被点的节点
    openNode(1);
    await sleep(640);
    const pnl = $('.tlPanel.show');
    ok('panelFits', !!pnl && (()=>{
      const r = pnl.getBoundingClientRect(), n1 = $$('.tlNode')[1].getBoundingClientRect();
      return r.left >= -1 && r.right <= innerWidth + 1 &&
             r.bottom <= innerHeight + 1 && n1.bottom <= r.top + 2;
    })());
    state.activeNode = null;

    document.title = R.join(' | ');
    document.body.setAttribute('data-test', R.join(' | '));
  })();
}


/* 点击穿透自检：?hit=1
   用 elementFromPoint 真实命中测试，逐一验证「看得见的按钮是不是点得到」 */
function hitProbe(){
  const pg = $('#p' + state.page) || $('.page.on') || document.body;
  const targets = $$('button, .card, .chip, .tlNode', pg)
    .filter(el=>{
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      // 只查「在视口内、看得见」的控件，被时间轴平移出屏幕的不算
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      // 收起状态的故事面板整块不参与（父级 opacity:0，子元素算出来仍是 1）
      const pn = el.closest('.tlPanel');
      if(pn && !pn.classList.contains('show')) return false;
      return r.width > 2 && r.height > 2 && cx > 0 && cy > 0 &&
             cx < innerWidth && cy < innerHeight &&
             cs.visibility !== 'hidden' && +cs.opacity > .05;
    });
  const bad = [];
  targets.forEach(el=>{
    const r = el.getBoundingClientRect();
    // 取按钮中心与四分之一位置，避开圆角/镂空
    const pts = [[.5,.5],[.3,.5],[.7,.5]];
    let good = false;
    for(const [fx,fy] of pts){
      const n = document.elementFromPoint(r.left + r.width*fx, r.top + r.height*fy);
      if(n && (el === n || el.contains(n) || n.contains(el))){ good = true; break; }
    }
    if(!good){
      const n = document.elementFromPoint(r.left + r.width/2, r.top + r.height/2);
      // 故事浮层盖住下面的节点是有意的层级关系，不算「点不到」
      if(n && n.closest('.tlPanel') && el.classList.contains('tlNode')) return;
      bad.push((el.id || el.className || el.tagName).toString().trim().slice(0,24) +
               '<' + (n ? (n.id || n.className || n.tagName).toString().trim().slice(0,24) : 'null'));
    }
  });
  const res = 'hit=' + (bad.length ? 'FAIL' : 'OK') + ' page=' + state.page +
              ' target=' + targets.length + ' blocked=' + bad.length +
              (bad.length ? ' :: ' + bad.join(' | ') : '');
  document.body.setAttribute('data-hit', res);
  document.title = res;
  return res;
}

/* 端到端点击自检：?click=1 —— 在按钮真实中心派发一次点击，看页面是否翻过去 */
function clickProbe(){
  const el = $('#startBtn');
  const r = el.getBoundingClientRect();
  const n = document.elementFromPoint(r.left + r.width/2, r.top + r.height/2);
  const hit = !!(n && (el === n || el.contains(n)));
  if(n) n.click();
  setTimeout(()=>{
    const res = 'click=' + (hit ? 'hit' : 'BLOCKED') + ' page=' + state.page +
                (hit && state.page === 2 ? ' OK' : ' FAIL');
    document.body.setAttribute('data-click', res);
    document.title = res;
  }, 1400);
}

/* 几何自检：?geo=1 —— 打印舞台缩放/居中是否精确 */
function geoProbe(){
  fitStages();
  const r = stageP.getBoundingClientRect();
  const res = `geo vw=${innerWidth} vh=${innerHeight} k=${view.k.toFixed(3)}` +
              ` box=${r.left.toFixed(1)},${r.top.toFixed(1)},${r.width.toFixed(1)}x${r.height.toFixed(1)}` +
              ` center=${(r.left+r.width/2).toFixed(1)},${(r.top+r.height/2).toFixed(1)}`;
  document.body.setAttribute('data-geo', res);
  document.title = res;
  return res;
}

/* 自检要等遮罩撤掉（线上首屏要等封面下载），否则会误判成「被遮罩挡住」 */
function afterVeil(fn, tries = 40){
  if(!document.getElementById('veil')) return fn();
  if(tries <= 0) return fn();
  setTimeout(()=>afterVeil(fn, tries - 1), 200);
}

function boot(){
  fitStages();
  buildGrid(2, NOODLES.slice(0,6), 0);
  buildGrid(3, NOODLES.slice(6,12), 6);
  buildTray();
  buildTimeline();
  paintDots();

  // 封面跳动结束后摘掉动画，按钮的按下回弹（:active）才能接管
  $$('#p1 .coverJump, #p1 .startWrap').forEach(el=>{
    el.addEventListener('animationend', (e)=>{
      if(e.animationName === 'coverHopY' || e.animationName === 'hopSyncY'){
        el.classList.add('hopDone');
      }
    });
  });

  // 首屏
  stageP.classList.add('live');
  state.page = 1;
  const dbg = new URLSearchParams(location.search).get('dbg');
  if(dbg){
    jump(dbg);
    const q0 = new URLSearchParams(location.search);
    if(q0.get('geo')) setTimeout(geoProbe, 300);
    if(q0.get('t')) setTimeout(runTest, 500);
    if(q0.get('hit')) setTimeout(hitProbe, 600);
    return;
  }
  const p1 = $('#p1');
  p1.classList.add('slow');
  revealCover(p1);
  paintDots();

  if(new URLSearchParams(location.search).get('t')) setTimeout(()=>afterVeil(runTest), 400);
  if(new URLSearchParams(location.search).get('geo')) setTimeout(geoProbe, 500);
  if(new URLSearchParams(location.search).get('hit')) afterVeil(hitProbe);
  if(new URLSearchParams(location.search).get('click')) afterVeil(clickProbe);
}

/* 等封面解码完成再揭开遮罩，让 0.8s 缓速淡入从头演一遍 */
function revealCover(p1){
  const veil = $('#veil');
  let fired = false;
  const lift = ()=>{
    if(fired) return;
    fired = true;
    if(veil){
      veil.classList.add('gone');
      setTimeout(()=>{ veil.remove(); }, 780);
    }
    // 揭开封面：优先等下一帧，保证 0.72s 的缓速淡入从头演；
    // 但某些环境（后台标签页、被隐藏的 iframe）rAF 会被挂起，
    // 所以再挂一个定时器兜底，绝不让页面停在透明状态点不动
    const show = ()=>{ if(!p1.classList.contains('on')) p1.classList.add('on'); };
    requestAnimationFrame(show);
    setTimeout(show, 120);
  };
  // 直接盯住页面上那张封面：它解码完就等于「可以看了」
  const cover = $('#p1 .cover');
  const soon = ()=> setTimeout(lift, 70);
  if(cover && cover.complete && cover.naturalWidth) soon();
  else if(cover){
    cover.addEventListener('load', soon, {once:true});
    cover.addEventListener('error', soon, {once:true});
  }else soon();
  addEventListener('load', ()=>setTimeout(lift, 260), {once:true});  // 兜底一：整页就绪
  setTimeout(lift, 2600);                                            // 兜底二：绝不卡在遮罩上
}

/* 调试直链：?dbg=1|2|2f|3|3f|4|4done|5|5a|5b|5c|8 —— 静态定格，便于逐页检视 */
function jump(code){
  const qs = new URLSearchParams(location.search);
  const vl = document.getElementById('veil');
  if(vl) vl.remove();
  if(!qs.get('anim') && !qs.get('t')) document.documentElement.classList.add('noanim');
  const n = parseInt(code, 10);
  $$('.page').forEach(p=>p.classList.remove('on','slow'));
  stageP.classList.add('live');
  $('#p'+n).classList.add('on');
  state.page = n;

  if(code === '2f' || code === '3f'){
    const g = $('#grid'+(code[0]==='2'?2:3));
    const cards = $$('.card', g).slice(0,3);
    cards.forEach((c,i)=>{
      c.dataset.deg = 180;
      c.querySelector('.inner').style.transform = 'rotateY(180deg)';
      c.classList.add('turned');
      if(i===0) c.classList.add('focus');
    });
    g.classList.add('hasFocus');
    $('#c'+code[0]).textContent = '3';
  }
  if(code === '4done'){
    ITEMS.forEach((it)=>{
      const el = $('.chip[data-id="'+it.id+'"]');
      const img = el.querySelector('img');
      const w = img.naturalWidth * (it.w/img.naturalWidth);
      const hh = img.getBoundingClientRect().height || it.w*0.8;
      el.style.left = (BOWL.x + it.slot[0] - it.w/2) + 'px';
      el.style.top  = (BOWL.y + it.slot[1] - it.w*0.4) + 'px';
      el.style.transform = `rotate(${it.rot}deg) scale(${it.sc})`;
      el.classList.add('placed','gone');
    });
    bowlArea.classList.add('done');
    $('#toast').classList.add('show');
  }
  if(code === '4r'){
    place($('.chip[data-id="radish"]'), ITEMS.find(x=>x.id==='radish'));
  }
  if(code === '4all'){
    ITEMS.forEach(it=>{ place($('.chip[data-id="'+it.id+'"]'), it); placedSet.clear(); });
  }
  if(n === 5){
    state.tlIdx = code==='5c' ? 2 : (code==='5b' ? 1 : 0);
    setTrackY(-state.tlIdx*1334, false);
    updateTlNext();
    if(code === '5a') openNode(0);
    if(code === '5b') openNode(2);
    if(code === '5c') openNode(4);
  }
  paintDots();
  if(qs.get('hit')) setTimeout(hitProbe, 600);
}

/* 调试出口：自动化脚本读内部状态用（const/let 不挂 window） */
window.__tlTo = i => { state.tlIdx = Math.max(0, Math.min(2, i));
  setTrackY(-state.tlIdx * 1334, false); paintDots(); updateTlNext(); };
window.__state = ()=>({ page: state.page, tlIdx: state.tlIdx, node: state.activeNode,
                        y: Math.round(currentY), k: view.k, crop: Math.round(view.crop) });

boot();
</script>
